<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TOURFLEX - Book Custom Package</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .navbar {
            background: #0d6efd;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            background: white;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        .info {
            margin: 10px 0;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            background: #198754;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #157347;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">TOURFLEX</div>
    <div>
        <a href="/">Home</a>
        <a href="/custom-package/my">My Custom Packages</a>
        <a href="/booking/my-bookings">My Bookings</a>
    </div>
</div>

<div class="container">
    <h2>Book Your Custom Tour Package</h2>

    <div class="info"><b>Location:</b> <span th:text="${customPkg.location}"></span></div>
    <div class="info"><b>Days:</b> <span th:text="${customPkg.numberOfDays}"></span></div>
    <div class="info"><b>People:</b> <span th:text="${customPkg.numberOfPeople}"></span></div>
    <div class="info"><b>Hotel:</b> <span th:text="${customPkg.hotelName}"></span></div>
    <div class="info"><b>Transport:</b> <span th:text="${customPkg.transportType}"></span></div>
    <div class="info"><b>Total Price:</b> Rs. <span th:text="${customPkg.totalPrice}"></span></div>

    <form action="/booking/save" method="post">
        <input type="hidden" name="customerName" th:value="${customPkg.customerName}">
        <input type="hidden" name="customerEmail" th:value="${customPkg.customerEmail}">
        <input type="hidden" name="numberOfPeople" th:value="${customPkg.numberOfPeople}">
        <input type="hidden" name="packageName" th:value="${'Custom Package - ' + customPkg.location}">
        <input type="hidden" name="location" th:value="${customPkg.location}">
        <input type="hidden" name="totalPrice" th:value="${customPkg.totalPrice}">

        <label>Booking Date</label>
        <input type="date" name="bookingDate" required>

        <button type="submit" class="btn">Confirm Booking</button>
    </form>
</div>

</body>
</html>
