<!DOCTYPE html>
<html>
<head>
    <title>TOURFLEX - Admin Login</title>
    <style>
        body {
            background: #0d6efd;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .box {
            width: 350px;
            margin: 120px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Admin Login</h2>

    <div class="error" th:if="${param.error}">
        Invalid admin username or password!
    </div>

    <form action="/admin/login" method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
