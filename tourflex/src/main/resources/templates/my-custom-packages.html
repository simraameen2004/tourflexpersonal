<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Custom Packages</title>
  <link rel="stylesheet" href="/css/style.css">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      margin: 0;
    }

    .navbar {
      background: #0d6efd;
      padding: 15px;
    }

    .navbar a {
      color: white;
      margin-right: 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 30px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .btn {
      padding: 8px 14px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .book {
      background: #198754;
      color: white;
    }

    .edit {
      background: #ffc107;
      color: black;
    }

    .delete {
      background: #dc3545;
      color: white;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #0d6efd;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <a href="/">Home</a>
  <a href="/custom-package/create">Customize Package</a>
  <a href="/custom-package/my">My Custom Packages</a>
  <a href="/booking/my-bookings">My Bookings</a>
</div>

<!-- CONTENT -->
<div class="container">

  <h2>My Custom Packages</h2>

  <!-- IF NO PACKAGES -->
  <div th:if="${packages == null or packages.isEmpty()}">
    <p>No custom packages created yet.</p>
  </div>

  <!-- PACKAGE LIST -->
  <div th:each="pkg : ${packages}" class="card">

    <p><b>Location:</b> <span th:text="${pkg.location}"></span></p>
    <p><b>Days:</b> <span th:text="${pkg.numberOfDays}"></span></p>
    <p><b>People:</b> <span th:text="${pkg.numberOfPeople}"></span></p>
    <p><b>Hotel:</b> <span th:text="${pkg.hotelName}"></span></p>
    <p><b>Transport:</b> <span th:text="${pkg.transportType}"></span></p>

    <p class="price">Total Price: Rs. <span th:text="${pkg.totalPrice}"></span></p>

    <!-- ACTION BUTTONS -->

    <!-- BOOK -->
    <a th:href="@{'/booking/custom/' + ${pkg.id}}">
      <button class="btn book">Book</button>
    </a>

    <!-- EDIT -->
    <a th:href="@{'/custom-package/edit/' + ${pkg.id}}">
      <button class="btn edit">Edit</button>
    </a>

    <!-- DELETE -->
    <a th:href="@{'/custom-package/delete/' + ${pkg.id}}"
       onclick="return confirm('Are you sure you want to delete this package?');">
      <button class="btn delete">Delete</button>
    </a>

  </div>

</div>

</body>
</html>
