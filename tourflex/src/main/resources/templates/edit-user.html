<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile - TOURFLEX</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="form-container">
    <h2>Edit Your Profile</h2>

    <form th:action="@{/user/update}" th:object="${user}" method="post" onsubmit="return validateEdit()">
        <input type="hidden" th:field="*{id}" />

        <label>Full Name:</label>
        <input type="text" id="name" th:field="*{name}" required>

        <label>Email (Cannot be changed):</label>
        <input type="email" id="email" th:field="*{email}" readonly style="background-color: #eee;">

        <label>Phone Number:</label>
        <input type="text" id="phone" th:field="*{phone}" required>
        <div id="phoneError" class="error-msg" style="color: #db0101; font-size: 12px; display: none;"></div>

        <label>Address:</label>
        <input type="text" id="address" th:field="*{address}" required>

        <label>New Password:</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Enter new or current password" required>
        <div id="passwordError" class="error-msg" style="color: #db0101; font-size: 12px; display: none;"></div>

        <button type="submit" class="btn">Update Profile</button>

        <div style="text-align: center; margin-top: 10px;">
            <a th:href="@{/user/profile}" class="cancel-link">Cancel</a>
        </div>

        <script>
            function validateEdit() {
                let phone = document.getElementById("phone");
                let password = document.getElementById("password");

                let phoneError = document.getElementById("phoneError");
                let passwordError = document.getElementById("passwordError");

                // Reset errors
                phoneError.style.display = "none";
                passwordError.style.display = "none";

                let isValid = true;

                // 1. Phone check (10 digits)
                if (phone.value.trim().length !== 10 || isNaN(phone.value.trim())) {
                    phoneError.innerText = "Phone number must be exactly 10 digits.";
                    phoneError.style.display = "block";
                    isValid = false;
                }

                // 2. Password complexity check
                let passRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&]).{6,}$/;
                if (!passRegex.test(password.value)) {
                    passwordError.innerText = "Password must be 6+ characters with letters, numbers, and symbols.";
                    passwordError.style.display = "block";
                    isValid = false;
                }

                return isValid; // If false, the page won't reload
            }
        </script>
    </form>
</div>

</body>
</html>
