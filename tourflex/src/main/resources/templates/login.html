<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<div class="navbar">
    <div class="logo">TOURFLEX</div>
</div>

<div class="form-container">
    <h2>Login</h2>

    <div th:if="${error}" style="color: red; background-color: #fce4e4; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #f5c2c2;">
        <p th:text="${error}" style="margin: 0; font-size: 14px;"></p>
    </div>

    <form action="/user/login" method="post" onsubmit="return validateLogin()">
        <input type="email" id="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button class="btn">Login</button>
    </form>
</div>

<script>
    function validateLogin() {
        let email = document.getElementById("email").value.trim();
        if (!email.includes("@")) {
            alert("Please enter a valid email address");
            return false;
        }
        return true;
    }
</script>

</body>
</html>
