<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>TOURFLEX - Bookings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin: 30px 0;
    }

    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }

    th {
      background: #0d6efd;
      color: white;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
      padding: 8px 12px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .delete-btn:hover {
      background: #bb2d3b;
    }
  </style>
</head>
<body>

<h1>All Bookings</h1>

<table>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Package</th>
    <th>Location</th>
    <th>Date</th>
    <th>People</th>
    <th>Total Price</th>
    <th>Status</th>
    <th>Refund</th>
    <th>Action</th>
  </tr>

  <tr th:each="b : ${bookings}">
    <td th:text="${b.id}"></td>
    <td th:text="${b.customerName}"></td>
    <td th:text="${b.customerEmail}"></td>
    <td th:text="${b.packageName}"></td>
    <td th:text="${b.location}"></td>
    <td th:text="${b.bookingDate}"></td>
    <td th:text="${b.numberOfPeople}"></td>
    <td th:text="${b.totalPrice}"></td>
    <td th:text="${b.bookingStatus}"></td>
    <td th:text="${b.refundStatus}"></td>
    <td>
      <a th:href="@{'/booking/delete/' + ${b.id}}"
         class="delete-btn"
         onclick="return confirm('Delete this booking?');">
        Delete
      </a>
    </td>
  </tr>
</table>

</body>
</html>
