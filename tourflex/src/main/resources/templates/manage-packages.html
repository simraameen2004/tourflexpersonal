<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TOURFLEX - Manage Packages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .navbar {
            background: #212529;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        table {
            width: 95%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #0d6efd;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        .edit-btn {
            background: #198754;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
        }

        .edit-btn:hover {
            background: #157347;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">TOURFLEX Admin</div>
    <div>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/packages/add-page">Add Package</a>
        <a href="/packages/manage">Manage Packages</a>
    </div>
</div>

<h1>Manage Tour Packages</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Type</th>
        <th>Max People</th>
        <th>Location</th>
        <th>Days</th>
        <th>Price</th>
        <th>Description</th>
        <th>Action</th>
    </tr>

    <tr th:each="pkg : ${packages}">
        <td th:text="${pkg.id}"></td>
        <td th:text="${pkg.name}"></td>
        <td th:text="${pkg.category}"></td>
        <td th:text="${pkg.type}"></td>
        <td th:text="${pkg.maxPeople}"></td>
        <td th:text="${pkg.location}"></td>
        <td th:text="${pkg.days}"></td>
        <td th:text="${pkg.price}"></td>
        <td th:text="${pkg.description}"></td>
        <td>
            <a th:href="@{'/packages/edit/' + ${pkg.id}}" class="edit-btn">Edit</a><br>
            <a th:href="@{'/packages/delete/' + ${pkg.id}}" class="delete-btn"
               onclick="return confirm('Are you sure you want to delete this package?');">Delete</a>
        </td>
    </tr>
</table>

</body>
</html>
