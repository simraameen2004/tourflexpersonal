<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Custom Package - TOURFLEX')}"></head>

<body class="bg-surface text-on-background selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">

<!-- TopNavBar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="flex-1 flex items-center justify-center py-24 px-margin-mobile">
    <div class="w-full max-w-lg bg-white p-10 rounded-3xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/20 mt-12">
        <div class="text-center mb-8">
            <h2 class="text-headline-md font-headline-md text-on-background">Edit Custom Package</h2>
            <p class="text-body-md text-on-surface-variant mt-2">Update your travel preferences</p>
        </div>

        <form action="/custom-package/update" method="post" class="flex flex-col gap-4">
            <input type="hidden" name="id" th:value="${pkg.id}">

            <div>
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Location</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">location_on</span>
                    <input type="text" name="location" th:value="${pkg.location}" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Days</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">schedule</span>
                        <input type="number" name="numberOfDays" th:value="${pkg.numberOfDays}" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required min="1">
                    </div>
                </div>
                <div>
                    <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">People</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">group</span>
                        <input type="number" name="numberOfPeople" th:value="${pkg.numberOfPeople}" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required min="1">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Hotel</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">hotel</span>
                    <input type="text" name="hotelName" th:value="${pkg.hotelName}" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required>
                </div>
            </div>

            <div>
                <label class="block text-label-md text-on-surface-variant mb-1.5 ml-1">Transport</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">directions_car</span>
                    <input type="text" name="transportType" th:value="${pkg.transportType}" class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary outline-none transition-all" required>
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-4">
                <button type="submit" class="w-full bg-primary text-on-primary py-3.5 rounded-xl font-label-md hover:bg-primary-container transition-all shadow-md">
                    Update Package
                </button>
                <a th:href="@{/custom-package/my}" class="w-full bg-surface-container-low text-on-surface-variant py-3.5 rounded-xl font-label-md hover:bg-surface-container-high transition-all text-center border border-outline-variant/30">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
