<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TOURFLEX - Manage Hotels</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        table {
            width: 95%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #0d6efd;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }
    </style>
</head>
<body>

<h1>Manage Hotels</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Hotel Name</th>
        <th>Location</th>
        <th>Star Rating</th>
        <th>Action</th>
    </tr>

    <tr th:each="hotel : ${hotels}">
        <td th:text="${hotel.id}"></td>
        <td th:text="${hotel.hotelName}"></td>
        <td th:text="${hotel.location}"></td>
        <td th:text="${hotel.starRating}"></td>
        <td>
            <a th:href="@{'/hotel/delete/' + ${hotel.id}}"
               class="delete-btn"
               onclick="return confirm('Delete this hotel?');">
                Delete
            </a>
        </td>
    </tr>
</table>

</body>
</html>
