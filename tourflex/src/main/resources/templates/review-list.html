<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TOURFLEX - Reviews</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .navbar {
            background: #0d6efd;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 30px 0 10px;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 10px;
        }

        .review-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .review-title {
            font-size: 20px;
            font-weight: bold;
        }

        .review-info {
            margin: 6px 0;
        }

        .rating {
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">TOURFLEX</div>
    <div>
        <a href="/">Home</a>
        <a href="/packages/list">Packages</a>
        <a href="/review/add-page">Add Review</a>
    </div>
</div>

<h1>⭐ Customer Reviews</h1>

<div class="container">
    <div class="review-card" th:each="review : ${reviews}">
        <div class="review-title" th:text="${review.packageName}"></div>
        <div class="review-info"><b>Name:</b> <span th:text="${review.customerName}"></span></div>
        <div class="review-info"><b>Email:</b> <span th:text="${review.customerEmail}"></span></div>
        <div class="review-info rating"><b>Rating:</b> <span th:text="${review.rating}"></span>/5</div>
        <div class="review-info"><b>Comment:</b> <span th:text="${review.comment}"></span></div>
    </div>
</div>

</body>
</html>
