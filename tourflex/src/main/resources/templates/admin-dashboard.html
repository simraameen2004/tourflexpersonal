<!DOCTYPE html>
<html>
<head>
  <title>TOURFLEX - Admin</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f7fb;
      margin: 0;
    }

    .navbar {
      background: linear-gradient(90deg, #212529, #343a40);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
    }

    .navbar .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .navbar a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .card {
      background: white;
      width: 260px;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      background: #0d6efd;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn:hover {
      background: #0b5ed7;
    }
  </style>
</head>

<body>

<div class="navbar">
  <div class="logo">TOURFLEX Admin</div>
  <div>
    <a href="/">Customer</a>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/packages/add-page">Add Package</a>
    <a href="/packages/manage">Manage Packages</a>
    <a href="/hotel/add-page">Add Hotel</a>
    <a href="/hotel/manage">Manage Hotels</a>
    <a href="/booking/list">Bookings</a>
    <a href="/review/add-page">Reviews</a>
    <a href="/payment/list">Payments</a>
    <a href="/refund/list">Refunds</a>
    <a href="/admin/logout">Logout</a>
  </div>
</div>

<h1>Admin Dashboard</h1>

<div class="container">

  <div class="card">
    <h3>Add Package</h3>
    <a href="/packages/add-page" class="btn">Open</a>
  </div>

  <div class="card">
    <h3>Manage Packages</h3>
    <a href="/packages/manage" class="btn">Open</a>
  </div>

  <div class="card">
    <h3>Add Hotel</h3>
    <a href="/hotel/add-page" class="btn">Open</a>
  </div>

  <div class="card">
    <h3>Manage Hotels</h3>
    <a href="/hotel/manage" class="btn">Open</a>
  </div>

  <div class="card">
    <h3>Bookings</h3>
    <a href="/booking/list" class="btn">Open</a>
  </div>

  <div class="card">
    <h3>Payments</h3>
    <a href="/payment/list" class="btn">Open</a>
  </div>

  <div class="card">
    <h3>Reviews</h3>
    <a href="/review/add-page" class="btn">Open</a>
  </div>

  <div class="card">
    <h3>Refunds</h3>
    <a href="/refund/list" class="btn">Open</a>
  </div>

</div>

</body>
</html>
